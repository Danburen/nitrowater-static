# Portal container nginx: plain static files, no SPA fallback needed.
# One single page; only /, /assets/*, /favicon.svg are ever requested.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript application/manifest+json image/svg+xml;

  # Container healthcheck
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Real files only; a missing path is a real 404 (no SPA fallback).
  location / {
    try_files $uri $uri/ =404;
  }

  # Hashed assets: long cache
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # HTML / JSON: revalidate on every release
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}
